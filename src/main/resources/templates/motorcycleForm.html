<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Taller de Motos - Gestión de Moto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">Taller de Motos 🏍️</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="/motorcycles">Volver a Motos</a>
        </div>
    </div>
</nav>

<main class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border-0 rounded-4 p-4 bg-white">


                {#if motorcycle.id != null}
                    <h3 class="fw-bold text-primary mb-4">
                        <i class="bi bi-pencil-square me-2"></i>Editar Motocicleta
                    </h3>
                {#else}
                    <h3 class="fw-bold text-primary mb-4">
                        <i class="bi bi-plus-circle me-2"></i>Registrar Nueva Motocicleta
                    </h3>
                {/if}


                <form action="{action}" method="POST">
                    {#if motorcycle.id != null}
                        <input type="hidden" name="id" value="{motorcycle.id}">
                    {/if}

                    <div class="mb-3">
                        <label for="plate" class="form-label fw-semibold">Placa</label>
                        <input type="text" class="form-control" id="plate" name="plate" value="{motorcycle.plate ?: ''}" required>
                    </div>

                    <div class="mb-3">
                        <label for="brand" class="form-label fw-semibold">Marca</label>
                        <input type="text" class="form-control" id="brand" name="brand" value="{motorcycle.brand ?: ''}" required>
                    </div>

                    <div class="mb-3">
                        <label for="modelLine" class="form-label fw-semibold">Modelo / Línea</label>
                        <input type="text" class="form-control" id="modelLine" name="modelLine" value="{motorcycle.modelLine ?: ''}" required>
                    </div>

                    <div class="mb-3">
                        <label for="clientId" class="form-label fw-semibold">Propietario (Cliente)</label>
                        <select class="form-select" id="clientId" name="clientId" required>
                            <option value="">Seleccione un cliente...</option>
                            {#for client in clients}
                                <option value="{client.id}" {#if motorcycle.client && motorcycle.client.id == client.id}selected{/if}>{client.fullName} ({client.identification})</option>
                            {/for}
                        </select>
                    </div>

                    <div class="d-flex justify-content-between mt-4">
                        <a href="/motorcycles" class="btn btn-secondary px-4">Cancelar</a>

                        {#if motorcycle.id != null}
                            <button type="submit" class="btn btn-primary px-4 fw-bold">Guardar Cambios</button>
                        {#else}
                            <button type="submit" class="btn btn-primary px-4 fw-bold">Registrar Moto</button>
                        {/if}
                    </div>
                </form>

            </div>
        </div>
    </div>
</main>

<footer class="text-center py-4 text-muted border-top bg-white mt-5">
    <p class="mb-0 small">&copy; 2026 - Taller de Motos - Arquitectura Hexagonal</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
