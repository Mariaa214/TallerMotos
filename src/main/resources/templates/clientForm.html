<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Taller de Motos - Registro de Cliente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">Taller de Motos 🏍️</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="/clients">Volver a Clientes</a>
        </div>
    </div>
</nav>

<main class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border-0 rounded-4 p-4 bg-white">

                {#if client != null && client.id != null}
                    <h3 class="fw-bold text-primary mb-4">
                        <i class="bi bi-pencil-square me-2"></i>Editar Cliente
                    </h3>
                {#else}
                    <h3 class="fw-bold text-primary mb-4">
                        <i class="bi bi-plus-circle me-2"></i>Registrar Nuevo Cliente
                    </h3>
                {/if}


                <form action="{#if client.id}/clients/update{#else}/clients/save{/if}" method="POST">
                    <!-- Campo oculto crucial para que llegue el ID al actualizar -->
                    {#if client.id}
                        <input type="hidden" name="id" value="{client.id}">
                    {/if}

                        <div class="mb-3">
                            <label for="identification" class="form-label fw-semibold">Identificación</label>
                            <input type="text" class="form-control" id="identification" name="identification" value="{client.identification ?: ''}" required>
                        </div>

                        <div class="mb-3">
                            <label for="fullName" class="form-label fw-semibold">Nombre Completo</label>
                            <input type="text" class="form-control" id="fullName" name="fullName" value="{client.fullName ?: ''}" required>
                        </div>

                        <div class="mb-3">
                            <label for="phone" class="form-label fw-semibold">Teléfono</label>
                            <input type="text" class="form-control" id="phone" name="phone" value="{client.phone ?: ''}" required>
                        </div>

                        <div class="d-flex justify-content-between mt-4">
                            <a href="/clients" class="btn btn-secondary px-4">Cancelar</a>

                            {#if client.id != null}
                                <button type="submit" class="btn btn-primary px-4 fw-bold">Guardar Cambios</button>
                            {#else}
                                <button type="submit" class="btn btn-primary px-4 fw-bold">Registrar Cliente</button>
                            {/if}
                        </div>
                    </form>
            </div>
        </div>
    </div>
</main>

<footer class="text-center py-4 text-muted border-top bg-white mt-5">
    <p class="mb-0 small">&copy; 2026 - Taller de Motos - Arquitectura Hexagonal</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
